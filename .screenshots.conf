# Read by the shared `screenshots` runner. Anything not set takes that script's defaults — device
# names, canvas size, and the wallpaper backdrop.

PROJECT="Sprite Cutter.xcodeproj"
SCHEME="Screenshots"
APP_BUNDLE_ID="com.jaydenirwin.spritecutter"
MAC_APP_NAME="Sprite Cutter"
PLATFORMS="iphone ipad mac vision"

# The Mac build is Catalyst, not native AppKit, so the macOS destination needs its variant named —
# `platform=macOS` alone does not match a Catalyst-only target.
MAC_DESTINATION="platform=macOS,variant=Mac Catalyst"

# What each shot shows, for the "Screenshots.md" the run writes beside them. Keyed by the UI test's
# capture name without its "NN-" prefix.
SHOT_DESCRIPTIONS="
  spritesheet = The app's only screen, with the demo sheet loaded: 112x80 of 16x16 sprites divided
                into 7 columns, ready to export as individual PNGs
"
