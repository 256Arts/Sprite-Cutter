# Read by the shared `screenshots` runner. Anything not set takes that script's defaults — device
# names, canvas size, and the wallpaper backdrop.

PROJECT="Sprite Cutter.xcodeproj"
SCHEME="Screenshots"
APP_BUNDLE_ID="com.jaydenirwin.spritecutter"
MAC_APP_NAME="Sprite Cutter"
PLATFORMS="iphone ipad mac vision"

# The Mac build is a native macOS app, so the plain destination matches it.
MAC_DESTINATION="platform=macOS"

# What each shot shows, for the "Screenshots.md" the run writes beside them. Keyed by the UI test's
# capture name without its "NN-" prefix.
SHOT_DESCRIPTIONS="
  spritesheet = The app's only screen, with the demo sheet loaded: 112x80 of 16x16 sprites divided
                into 7 columns, ready to export as individual PNGs
"

# The app's folder on the 256 Arts site. `--upload` refreshes the shots its page shows from
# the ones here, resized to the frame that page draws.
WEBSITE_SLUG="spritecutter"

# The headline each shot is sold under on the website, written from the sentence in
# SHOT_DESCRIPTIONS that says what it shows. Keyed the same way, so a line follows its shot
# when the listing reorders.
SHOT_PROMOS="
  spritesheet = Drop in a sheet, get every sprite back.
"
